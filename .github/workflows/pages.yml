name: Validate and publish Tidebreak

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/compliance/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: tidebreak
    steps:
      - uses: actions/checkout@v6
        with:
          path: tidebreak
      - uses: actions/checkout@v6
        with:
          repository: 404-Repo/404-game-recipe
          ref: 4effad311c5e137bca316257259fe5bffd6737de
          path: 404-game-recipe
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install validation tools
        working-directory: 404-game-recipe
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci
      - name: Validate release
        run: |
          npm test
          npm run check:release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tidebreak/game

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
